<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kut Milz OSINT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #1a1a3e, #0f0e17 80%);
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            perspective: 1200px;
        }
        .glass-card {
            background: rgba(26, 26, 46, 0.7);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 215, 0, 0.05) inset;
            padding: 32px 28px;
            max-width: 820px;
            width: 100%;
            transform: rotateX(2deg) rotateY(-1deg);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .glass-card:hover {
            transform: rotateX(0deg) rotateY(0deg) scale(1.01);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(255, 215, 0, 0.1) inset;
        }
        .header { text-align: center; margin-bottom: 28px; }
        .header .icon {
            font-size: 56px;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            margin-top: 4px;
        }
        .header .sub { color: #a7a9be; font-size: 1rem; margin-top: 4px; }
        .badge {
            display: inline-block;
            background: rgba(255, 215, 0, 0.12);
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.2);
            font-size: 0.7rem;
            padding: 4px 16px;
            border-radius: 30px;
            margin-top: 8px;
            font-weight: 600;
        }
        .backend-section {
            background: rgba(22, 33, 62, 0.6);
            border-radius: 24px;
            padding: 20px 18px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s;
        }
        .backend-section .label {
            color: #a7a9be;
            font-size: 0.85rem;
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }
        .backend-input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .backend-input-group input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 18px;
            border: 2px solid #0f3460;
            background: #0f0e17;
            color: #fffffe;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            min-width: 200px;
        }
        .backend-input-group input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.1);
        }
        .backend-input-group button {
            padding: 14px 28px;
            border: none;
            border-radius: 18px;
            font-weight: 700;
            background: #ffd700;
            color: #0f0e17;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .backend-input-group button:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(255, 215, 0, 0.3);
        }
        .backend-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            font-size: 0.9rem;
            padding: 8px 14px;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.2);
        }
        .backend-status .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #555;
            transition: 0.3s;
        }
        .backend-status .status-dot.connected {
            background: #2ecc71;
            box-shadow: 0 0 16px #2ecc7180;
        }
        .backend-status .status-text { color: #a7a9be; }
        .backend-status .status-text strong { color: #fffffe; word-break: break-all; }
        .backend-status .connected-text { color: #2ecc71; }
        .login-area {
            margin-top: 14px;
            display: none;
        }
        .login-area.show { display: block; }
        .login-area .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .login-area .input-group input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 18px;
            border: 2px solid #0f3460;
            background: #0f0e17;
            color: #fffffe;
            font-size: 1rem;
            outline: none;
            min-width: 160px;
        }
        .login-area .input-group input:focus { border-color: #ffd700; }
        .login-area .input-group button {
            padding: 14px 28px;
            border: none;
            border-radius: 18px;
            font-weight: 700;
            background: #ffd700;
            color: #0f0e17;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-area .input-group button:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(255, 215, 0, 0.3);
        }
        .login-error { color: #e74c3c; font-size: 0.85rem; margin-top: 8px; }

        .main-app { display: none; margin-top: 10px; }
        .main-app.show { display: block; }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            color: #a7a9be;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .form-row { display: flex; gap: 14px; flex-wrap: wrap; }
        .form-row .form-group { flex: 1; min-width: 140px; }
        .form-control {
            width: 100%;
            padding: 14px 16px;
            border-radius: 18px;
            border: 2px solid #0f3460;
            background: #0f0e17;
            color: #fffffe;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }
        .form-control:focus {
            border-color: #ffd700;
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.1);
        }
        .checkbox-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin: 6px 0 10px;
        }
        .checkbox-grid .form-check {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #a7a9be;
            font-size: 0.9rem;
        }
        .checkbox-grid .form-check input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #ffd700;
            cursor: pointer;
        }
        .btn-search {
            background: #ffd700;
            color: #0f0e17;
            border: none;
            border-radius: 18px;
            padding: 14px 32px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        .btn-search:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(255, 215, 0, 0.3);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid #0f3460;
            color: #a7a9be;
            border-radius: 18px;
            padding: 10px 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fffffe;
        }
        .btn-telegram {
            background: #2ecc71;
            color: #0f0e17;
            border: none;
            border-radius: 18px;
            padding: 10px 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-telegram:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(46, 204, 113, 0.3);
        }
        .results-area {
            margin-top: 24px;
            display: none;
        }
        .results-area.show { display: block; }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .results-header h4 { color: #ffd700; font-size: 1.2rem; }
        .results-header .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .table-wrap {
            overflow-x: auto;
            border-radius: 18px;
            border: 1px solid #0f3460;
            background: #0f0e17;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            color: #fffffe;
            font-size: 0.9rem;
        }
        table thead {
            background: #0f0e17;
            border-bottom: 2px solid #ffd700;
        }
        table thead th {
            padding: 14px 12px;
            text-align: left;
            color: #ffd700;
            font-weight: 600;
        }
        table tbody td {
            padding: 12px 12px;
            border-bottom: 1px solid #0f3460;
            vertical-align: middle;
        }
        table tbody tr:last-child td { border-bottom: none; }
        .badge-source {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            background: #ff6b6b;
            color: #fff;
        }
        .badge-source.truepeoplesearch { background: #3498db; }
        .badge-source.fastpeoplesearch { background: #2ecc71; }
        .badge-source.whitepages { background: #f39c12; }
        .badge-source.usphonebook { background: #8e44ad; }
        .loader {
            display: none;
            text-align: center;
            padding: 30px 0;
        }
        .loader.show { display: block; }
        .loader .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #0f3460;
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #555;
            font-size: 0.75rem;
            border-top: 1px solid #0f3460;
            padding-top: 16px;
        }
        .footer .edu-badge {
            display: inline-block;
            background: rgba(255, 107, 107, 0.08);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.15);
            font-size: 0.65rem;
            padding: 2px 14px;
            border-radius: 30px;
            margin-bottom: 4px;
        }
        .empty-state { color: #555; text-align: center; padding: 30px 0; }
        @media (max-width: 600px) {
            .glass-card { padding: 20px 16px; }
            .header h1 { font-size: 1.8rem; }
            .backend-input-group input, .login-area .input-group input { min-width: 120px; }
            .results-header { flex-direction: column; align-items: stretch; gap: 10px; }
            .results-header .actions { justify-content: flex-start; }
        }
    </style>
</head>
<body>

<div class="glass-card">

    <div class="header">
        <div class="icon"><i class="fas fa-robot"></i></div>
        <h1>Kut Milz OSINT</h1>
        <div class="sub">Advanced people search · Multiple sources</div>
        <div class="badge"><i class="fas fa-shield-alt"></i> Educational Use Only</div>
    </div>

    <!-- BACKEND CONNECTION -->
    <div class="backend-section">
        <label class="label"><i class="fas fa-server"></i> Backend URL</label>
        <div class="backend-input-group">
            <input type="url" id="backendUrl" placeholder="https://your-cloudflare-tunnel-url" />
            <button id="connectBtn"><i class="fas fa-plug"></i> Connect</button>
        </div>
        <div class="backend-status" id="backendStatus">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">Not connected</span>
        </div>

        <!-- ACCESS KEY LOGIN -->
        <div class="login-area" id="loginArea">
            <div class="input-group">
                <input type="text" id="accessKey" placeholder="Enter access key" />
                <button id="loginBtn"><i class="fas fa-key"></i> Unlock</button>
            </div>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div class="main-app" id="mainApp">

        <form id="searchForm">
            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Phone *</label>
                    <input type="text" class="form-control" name="phone" placeholder="(555) 555-1212" required />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user"></i> First Name</label>
                    <input type="text" class="form-control" name="first_name" placeholder="John" />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Last Name</label>
                    <input type="text" class="form-control" name="last_name" placeholder="Doe" />
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-city"></i> City</label>
                    <input type="text" class="form-control" name="city" placeholder="Los Angeles" />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-map-pin"></i> State</label>
                    <input type="text" class="form-control" name="state" placeholder="CA" />
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-database"></i> Sources</label>
                <div class="checkbox-grid">
                    <div class="form-check">
                        <input type="checkbox" name="sources" value="usphonebook" checked id="srcUs" />
                        <label for="srcUs">USPhoneBook</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" name="sources" value="truepeoplesearch" checked id="srcTp" />
                        <label for="srcTp">TruePeopleSearch</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" name="sources" value="fastpeoplesearch" checked id="srcFp" />
                        <label for="srcFp">FastPeopleSearch</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" name="sources" value="whitepages" checked id="srcWp" />
                        <label for="srcWp">Whitepages</label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-search"><i class="fas fa-search"></i> Search</button>
        </form>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p style="color:#a7a9be;">Searching sources...</p>
        </div>

        <div class="results-area" id="resultsArea">
            <div class="results-header">
                <h4><i class="fas fa-list"></i> Results (<span id="resultCount">0</span>)</h4>
                <div class="actions">
                    <button class="btn-secondary" id="downloadBtn"><i class="fas fa-download"></i> CSV</button>
                    <button class="btn-telegram" id="sendTelegramBtn"><i class="fab fa-telegram"></i> Send CSV</button>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Name</th><th>Address</th><th>Details</th><th>Source</th></tr></thead>
                    <tbody id="resultsBody"></tbody>
                </table>
            </div>
        </div>

        <div class="footer">
            <div class="edu-badge"><i class="fas fa-graduation-cap"></i> EDUCATIONAL USE ONLY</div>
            <p><strong>Never use this tool for illegal purposes.</strong> Respect privacy and terms of service.</p>
        </div>
    </div>

</div>

<script>
    // ============================================
    // STATE
    // ============================================
    let backendUrl = '';
    let connected = false;
    let authenticated = false;
    let currentQueryParams = {};

    // ============================================
    // DOM REFS
    // ============================================
    const backendUrlInput = document.getElementById('backendUrl');
    const connectBtn = document.getElementById('connectBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const loginArea = document.getElementById('loginArea');
    const accessKeyInput = document.getElementById('accessKey');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const mainApp = document.getElementById('mainApp');
    const searchForm = document.getElementById('searchForm');
    const loader = document.getElementById('loader');
    const resultsArea = document.getElementById('resultsArea');
    const resultsBody = document.getElementById('resultsBody');
    const resultCount = document.getElementById('resultCount');
    const downloadBtn = document.getElementById('downloadBtn');
    const sendTelegramBtn = document.getElementById('sendTelegramBtn');

    // ============================================
    // UTILITY
    // ============================================
    function setStatus(connectedState, url = '') {
        if (connectedState) {
            statusDot.className = 'status-dot connected';
            statusText.innerHTML = `<span class="connected-text">● Connected</span> to <strong>${url}</strong>`;
        } else {
            statusDot.className = 'status-dot';
            statusText.textContent = 'Not connected';
        }
        connected = connectedState;
        if (connected) {
            loginArea.classList.add('show');
        } else {
            loginArea.classList.remove('show');
        }
    }

    async function apiCall(endpoint, method = 'POST', body = null) {
        const url = `${backendUrl}${endpoint}`;
        const options = { method, headers: { 'Accept': 'application/json' } };
        if (body) {
            if (body instanceof FormData) {
                options.body = body;
            } else {
                options.headers['Content-Type'] = 'application/json';
                options.body = JSON.stringify(body);
            }
        }
        const response = await fetch(url, options);
        if (!response.ok) {
            const text = await response.text();
            throw new Error(`HTTP ${response.status}: ${text}`);
        }
        return response.json();
    }

    // ============================================
    // CONNECT TO BACKEND
    // ============================================
    async function connectToBackend(url) {
        const cleanUrl = url.replace(/\/+$/, '');
        backendUrl = cleanUrl;
        setStatus(false, backendUrl);
        statusText.textContent = 'Connecting...';

        try {
            const testResp = await fetch(`${backendUrl}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ access_key: 'test' }),
            });
            if (testResp.status === 401 || testResp.status === 200) {
                setStatus(true, backendUrl);
                statusText.innerHTML = `<span class="connected-text">● Connected</span> to <strong>${backendUrl}</strong> – enter access key.`;
                localStorage.setItem('osint_backend', backendUrl);
                return true;
            } else {
                throw new Error('Unexpected response');
            }
        } catch (err) {
            setStatus(false);
            statusText.textContent = `❌ Connection failed: ${err.message}`;
            loginArea.classList.remove('show');
            return false;
        }
    }

    connectBtn.addEventListener('click', async () => {
        const url = backendUrlInput.value.trim();
        if (!url) {
            setStatus(false);
            statusText.textContent = 'Please enter a URL';
            return;
        }
        await connectToBackend(url);
    });

    // ============================================
    // LOGIN
    // ============================================
    async function performLogin() {
        const key = accessKeyInput.value.trim();
        if (!key) {
            loginError.textContent = 'Please enter an access key.';
            return;
        }
        loginError.textContent = '';

        if (!connected) {
            const savedUrl = localStorage.getItem('osint_backend');
            const urlToUse = backendUrlInput.value.trim() || savedUrl;
            if (!urlToUse) {
                loginError.textContent = 'No backend URL found. Please enter a URL and connect first.';
                return;
            }
            const connectedOk = await connectToBackend(urlToUse);
            if (!connectedOk) {
                loginError.textContent = 'Auto‑connect failed. Please check the backend URL.';
                return;
            }
        }

        try {
            const data = await apiCall('/login', 'POST', { access_key: key });
            if (data.success) {
                authenticated = true;
                loginArea.classList.remove('show');
                mainApp.classList.add('show');
                setStatus(true, backendUrl);
                statusText.innerHTML = `<span class="connected-text">● Connected & Authenticated</span> to <strong>${backendUrl}</strong>`;
            } else {
                loginError.textContent = 'Invalid access key.';
            }
        } catch (err) {
            loginError.textContent = `Error: ${err.message}`;
        }
    }

    loginBtn.addEventListener('click', performLogin);
    accessKeyInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') performLogin();
    });

    // ============================================
    // SEARCH
    // ============================================
    searchForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!authenticated) {
            alert('Please authenticate first.');
            return;
        }
        const formData = new FormData(searchForm);
        currentQueryParams = {};
        formData.forEach((value, key) => {
            if (key === 'sources') {
                if (!currentQueryParams[key]) currentQueryParams[key] = [];
                currentQueryParams[key].push(value);
            } else {
                currentQueryParams[key] = value;
            }
        });

        loader.classList.add('show');
        resultsArea.classList.remove('show');

        try {
            const data = await apiCall('/search', 'POST', formData);
            loader.classList.remove('show');
            if (data.error) {
                alert(data.error);
                return;
            }
            const results = data.results || [];
            resultCount.textContent = results.length;
            const tbody = resultsBody;
            tbody.innerHTML = '';
            if (results.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty-state">No results found.</td></tr>`;
            } else {
                results.forEach(r => {
                    let sourceClass = r.source.toLowerCase().replace(/[^a-z]/g, '');
                    let badge = `<span class="badge-source ${sourceClass}">${r.source}</span>`;
                    tbody.innerHTML += `
                        <tr>
                            <td>${r.name || ''}</td>
                            <td>${r.address || ''}</td>
                            <td>${r.details || ''}</td>
                            <td>${badge}</td>
                        </tr>
                    `;
                });
            }
            resultsArea.classList.add('show');

            const params = new URLSearchParams();
            for (let key in currentQueryParams) {
                if (Array.isArray(currentQueryParams[key])) {
                    currentQueryParams[key].forEach(v => params.append(key, v));
                } else {
                    params.append(key, currentQueryParams[key]);
                }
            }
            downloadBtn.onclick = () => {
                window.open(`${backendUrl}/download_csv?${params.toString()}`, '_blank');
            };

            sendTelegramBtn.onclick = async () => {
                const formData2 = new FormData();
                for (let key in currentQueryParams) {
                    if (Array.isArray(currentQueryParams[key])) {
                        currentQueryParams[key].forEach(v => formData2.append(key, v));
                    } else {
                        formData2.append(key, currentQueryParams[key]);
                    }
                }
                try {
                    const result = await apiCall('/send_csv', 'POST', formData2);
                    if (result.success) {
                        alert('✅ CSV sent to Telegram!');
                    } else {
                        alert('❌ Failed: ' + (result.error || 'unknown error'));
                    }
                } catch (err) {
                    alert('Error sending CSV: ' + err.message);
                }
            };

        } catch (err) {
            loader.classList.remove('show');
            alert('Search failed: ' + err.message);
        }
    });

    // ============================================
    // AUTO-CONNECT ON LOAD
    // ============================================
    (function init() {
        const saved = localStorage.getItem('osint_backend');
        if (saved) {
            backendUrlInput.value = saved;
            setTimeout(async () => {
                await connectToBackend(saved);
                if (connected) {
                    accessKeyInput.focus();
                }
            }, 800);
        } else {
            backendUrlInput.placeholder = 'https://your-cloudflare-tunnel-url';
        }
    })();
</script>
