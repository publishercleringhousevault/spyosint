<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kut Milz OSINT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-[#0f0e17] text-white min-h-screen">

    <div class="max-w-5xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold bg-gradient-to-r from-yellow-400 to-red-500 bg-clip-text text-transparent">
                <i class="fas fa-robot"></i> Kut Milz OSINT
            </h1>
            <p class="text-gray-400 mt-2">Phone number intelligence – multiple sources</p>
        </div>

        <!-- Search Card -->
        <div class="bg-[#1a1a2e] rounded-2xl p-6 border border-[#2a2a4a] shadow-xl">
            <form id="searchForm" class="flex flex-col sm:flex-row gap-4">
                <input type="text" id="phoneInput" placeholder="Enter phone number (e.g. 555-555-1212)" class="flex-1 bg-[#0f0e17] border-2 border-[#0f3460] rounded-xl px-5 py-3 text-white placeholder-gray-500 focus:border-yellow-400 focus:outline-none transition">
                <button type="submit" class="bg-yellow-400 hover:bg-yellow-500 text-black font-bold rounded-xl px-8 py-3 transition flex items-center justify-center gap-2">
                    <i class="fas fa-search"></i> Search
                </button>
            </form>
        </div>

        <!-- Results -->
        <div id="resultsContainer" class="mt-8 hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-yellow-400">
                    <i class="fas fa-list"></i> Results (<span id="resultCount">0</span>)
                </h2>
                <button id="exportBtn" class="bg-[#2a2a4a] hover:bg-[#3a3a5a] text-white rounded-xl px-5 py-2 transition flex items-center gap-2">
                    <i class="fas fa-download"></i> Export CSV
                </button>
            </div>
            <div id="resultsList" class="space-y-3"></div>
        </div>

        <!-- Loading -->
        <div id="loading" class="mt-8 text-center hidden">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-yellow-400 border-t-transparent"></div>
            <p class="text-gray-400 mt-3">Searching sources...</p>
        </div>

        <!-- Footer -->
        <div class="text-center text-gray-600 text-sm mt-12 border-t border-[#1a1a2e] pt-6">
            <span class="bg-red-500/10 text-red-400 px-3 py-1 rounded-full text-xs">🔐 EDUCATIONAL USE ONLY</span>
            <p class="mt-2">Respect privacy. Never misuse this tool.</p>
        </div>
    </div>

    <script>
        const searchForm = document.getElementById('searchForm');
        const phoneInput = document.getElementById('phoneInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsList = document.getElementById('resultsList');
        const resultCount = document.getElementById('resultCount');
        const loading = document.getElementById('loading');
        const exportBtn = document.getElementById('exportBtn');

        let lastResults = [];

        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = phoneInput.value.trim();
            if (!phone) return;

            loading.classList.remove('hidden');
            resultsContainer.classList.add('hidden');

            try {
                const formData = new FormData();
                formData.append('phone', phone);
                const res = await fetch('/search', { method: 'POST', body: formData });
                const data = await res.json();

                loading.classList.add('hidden');

                if (data.error) {
                    alert(data.error);
                    return;
                }

                lastResults = data.results || [];
                resultCount.textContent = lastResults.length;

                if (lastResults.length === 0) {
                    resultsList.innerHTML = `
                        <div class="bg-[#1a1a2e] rounded-xl p-6 text-center text-gray-400 border border-[#2a2a4a]">
                            <i class="fas fa-search text-4xl mb-2"></i>
                            <p>No results found for this number.</p>
                        </div>
                    `;
                } else {
                    resultsList.innerHTML = lastResults.map(r => `
                        <div class="bg-[#1a1a2e] rounded-xl p-4 border-l-4 border-yellow-400 border border-[#2a2a4a] hover:border-yellow-400/50 transition">
                            <div class="flex flex-wrap justify-between items-start">
                                <div>
                                    <div class="font-bold text-lg">${r.name || 'N/A'}</div>
                                    <div class="text-gray-400 text-sm">${r.address || ''}</div>
                                    <div class="text-gray-500 text-sm mt-1">${r.details || ''}</div>
                                </div>
                                <span class="text-xs px-3 py-1 rounded-full bg-[#0f3460] text-yellow-400 font-medium">${r.source || 'Unknown'}</span>
                            </div>
                        </div>
                    `).join('');
                }

                resultsContainer.classList.remove('hidden');
            } catch (err) {
                loading.classList.add('hidden');
                alert('Search failed. Check console for details.');
                console.error(err);
            }
        });

        exportBtn.addEventListener('click', async () => {
            if (lastResults.length === 0) {
                alert('No results to export.');
                return;
            }
            try {
                const res = await fetch('/export_csv', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ results: lastResults })
                });
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'osint_results.csv';
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            } catch (err) {
                alert('Export failed.');
                console.error(err);
            }
        });
    </script>

</body>
</html>
